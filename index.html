<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Iconos y manifest (NUEVO) -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512x512.png">
    <link rel="shortcut icon" href="favicon.ico">
    
    <!-- Meta tags para móvil (NUEVO) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#27ae60">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Acceso Taller - Control de Herramientas</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .error {
            color: #e74c3c;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔧</div>
        <h2>Control de Herramientas Taller</h2>
        
        <div class="input-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" placeholder="Ej: admin, juan, maria" autocomplete="off">
        </div>
        
        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button onclick="login()">Acceder al Taller</button>
        
        <div class="error" id="errorMessage">Usuario o contraseña incorrectos</div>
        
        <div class="info">
            <strong>🔐 Accesos de prueba:</strong><br>
            Admin: admin / admin123<br>
            Trabajador: juan / juan123<br>
            Trabajador: maria / maria123
        </div>
    </div>

    <script>
        // Credenciales válidas
        const USERS = {
            'admin': { password: 'admin123', role: 'admin', name: 'Administrador' },
            'juan': { password: 'juan123', role: 'worker', name: 'Juan Pérez' },
            'maria': { password: 'maria123', role: 'worker', name: 'María García' }
        };

        function login() {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            // Validar que los campos no estén vacíos
            if (!username || !password) {
                errorDiv.textContent = 'Por favor, completa todos los campos';
                errorDiv.style.display = 'block';
                return;
            }

            // Verificar credenciales
            const user = USERS[username];
            
            if (user && user.password === password) {
                // Guardar sesión
                sessionStorage.setItem('currentUser', JSON.stringify({
                    username: username,
                    name: user.name,
                    role: user.role
                }));
                
                // Redirigir según el rol
                if (user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'mis-herramientas.html';
                }
            } else {
                errorDiv.textContent = 'Usuario o contraseña incorrectos';
                errorDiv.style.display = 'block';
            }
        }

        // Permitir login con Enter
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        // REGISTRO SERVICE WORKER (NUEVO)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado:', registration);
                    })
                    .catch(error => {
                        console.log('Error registrando ServiceWorker:', error);
                    });
            });
        }

        // Botón de instalación (NUEVO)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Aquí podrías mostrar un botón de instalación si quieres
        });
    </script>
</body>
</html>
