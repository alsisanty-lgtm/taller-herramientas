<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Taller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            padding: 40px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #2c3e50;
            font-size: 2em;
        }
        
        .logo p {
            color: #7f8c8d;
            margin-top: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #219a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .info {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🔧 TALLER MECÁNICO</h1>
            <p>Acceso para trabajadores</p>
        </div>
        
        <div class="form-group">
            <label>👤 Tu nombre</label>
            <input type="text" id="nombreInput" placeholder="Ej: Juan Pérez" autocomplete="off">
        </div>
        
        <button class="btn" onclick="acceder()">✅ Acceder al taller</button>
        
        <div class="error" id="errorMensaje">
            Usuario no encontrado o inactivo
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">Verificando...</p>
        </div>
        
        <div class="info">
            Solo personal autorizado
        </div>
    </div>

    <script type="module">
        import { db, collection, query, where, getDocs } from './firebase-config.js';

        window.acceder = async function() {
            const nombre = document.getElementById('nombreInput').value.trim();
            
            if (!nombre || nombre.length < 3) {
                alert('Por favor, introduce tu nombre completo');
                return;
            }
            
            // Mostrar loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('errorMensaje').style.display = 'none';
            
            try {
                // Buscar usuario en Firebase
                const q = query(collection(db, "usuarios_taller"), where("nombre", "==", nombre));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    // Usuario no encontrado
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('errorMensaje').style.display = 'block';
                    return;
                }
                
                // Usuario encontrado
                const usuario = {
                    id: querySnapshot.docs[0].id,
                    ...querySnapshot.docs[0].data()
                };
                
                if (usuario.activo === false) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('errorMensaje').textContent = 'Usuario desactivado. Contacta al administrador.';
                    document.getElementById('errorMensaje').style.display = 'block';
                    return;
                }
                
                // Guardar sesión
                localStorage.setItem('taller_usuario', JSON.stringify({
                    id: usuario.id,
                    nombre: usuario.nombre
                }));
                
                // Redirigir a la app
                window.location.href = 'mis-herramientas.html';
                
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMensaje').textContent = 'Error de conexión';
                document.getElementById('errorMensaje').style.display = 'block';
            }
        };
    </script>
</body>
</html>
