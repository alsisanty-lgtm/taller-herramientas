<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller - Control Herramientas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: #f0f2f5;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .user-section {
            background: white;
            padding: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .user-input {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            width: 250px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-primary {
            background: #27ae60;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .tool-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border-left: 5px solid #2ecc71;
        }
        
        .tool-card.roto {
            border-left-color: #e74c3c;
            background: #fff5f5;
        }
        
        .tool-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        .status-bueno {
            background: #d4edda;
            color: #155724;
        }
        
        .status-roto {
            background: #f8d7da;
            color: #721c24;
        }
        
        .tool-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: flex-end;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .report-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .buscador {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border: 2px solid #e9ecef;
            border-radius: 8px;
        }
        
        .sync-status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }
        
        .connected {
            color: #27ae60;
            font-weight: bold;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔧 CONTROL HERRAMIENTAS</h1>
        <p>Identifícate con tu nombre</p>
    </div>

    <div class="user-section">
        <input type="text" id="userNameInput" class="user-input" placeholder="👤 Tu nombre" value="">
        <button class="btn btn-primary" onclick="registrarTrabajador()">✅ Entrar al Taller</button>
    </div>

    <div class="container">
        <div id="welcomeSection" style="display: none;" class="welcome-message"></div>

        <div class="stats-grid" id="statsContainer">
            <div class="stat-card">Cargando...</div>
        </div>

        <input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar herramienta...">

        <div class="tools-grid" id="toolsContainer">
            <div style="text-align: center; padding: 40px; background: white; border-radius: 10px;">
                Identifícate para comenzar
            </div>
        </div>

        <div class="sync-status" id="syncStatus">
            <span class="connected">🟢 Esperando conexión...</span>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { db, collection, query, onSnapshot, addDoc, updateDoc, doc, getDocs } from './firebase-config.js';

        const herramientasData = [
            "Juego de carracas", "Caja de herramientas BT.11A",
            "Llave con trinquete 467B.10", "Llave trinquete 467B.13",
            "Llave trinquete 467B.17", "Llave trinquete 467B.19",
            "Llave mixta 440.10", "Llave mixta 440.13",
            "Llave mixta 440.17", "Llave mixta 440.19",
            "Llave mixta 440.20", "Llave mixta 440.22",
            "Llave mixta 440.24", "Llave mixta 440.36",
            "Llave de pipa 75.10", "Llave de pipa 75.13",
            "Llave de pipa 75.17", "Llave de pipa 75.19",
            "Llave de vaso con mango 74A.7", "Llave de vaso con mango 74A.8",
            "Llave inglesa 101.10", "Destornilladores juego ATP.J6",
            "Llaves Allen con mango 84TZA", "Juego llaves de Allen 83H.JP9A",
            "Alicates de corte 192A.18CPE", "Alicates de punta 185A.20CPE",
            "Alicates universales 187A.18CPE", "Picoloro 181A.25CPE",
            "Alicates para arandela 179A.9", "Mordaza de presión 580.10",
            "Calibre 805.2", "Escuadra DELA.1223.03",
            "Metro 893B.825", "Nivel 3078.40",
            "Tiralíneas DELA.13299.15", "Maza 1262H.125",
            "Cincel 263.25", "Alargadera 50m",
            "Combo Makita DGA504 + DHP486 + SAMP", "Taladro Makita DTW285Z",
            "Taladro Makita percutor HP2071", "Máquina de soldar",
            "Carro transporte herramientas"
        ];

        let trabajadorActual = null;
        let herramientas = [];
        let filtro = '';

        function mostrarToast(mensaje) {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            toast.textContent = mensaje;
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        async function inicializarDatos() {
            try {
                const querySnapshot = await getDocs(collection(db, "herramientas"));
                
                if (querySnapshot.empty) {
                    for (const nombre of herramientasData) {
                        await addDoc(collection(db, "herramientas"), {
                            nombre: nombre,
                            codigo: "COD-" + Math.random().toString(36).substr(2, 5),
                            cantidad: 1,
                            presente: true,
                            estado: 'bueno',
                            reportes: []
                        });
                    }
                    console.log("✅ Datos iniciales cargados");
                }
                
                document.getElementById('syncStatus').innerHTML = '<span class="connected">🟢 Conectado a la nube</span>';
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('syncStatus').innerHTML = '<span style="color:#e74c3c;">❌ Error de conexión</span>';
            }
        }

        window.registrarTrabajador = async function() {
            const nombre = document.getElementById('userNameInput').value.trim();
            
            if (!nombre || nombre.length < 3) {
                alert('Introduce tu nombre');
                return;
            }
            
            trabajadorActual = {
                id: 'usr_' + Date.now(),
                nombre: nombre
            };
            
            document.getElementById('welcomeSection').style.display = 'block';
            document.getElementById('welcomeSection').innerHTML = `👋 Bienvenido, <strong>${nombre}</strong>`;
            
            await inicializarDatos();
            escucharCambios();
        };

        function escucharCambios() {
            const q = query(collection(db, "herramientas"));
            
            onSnapshot(q, (snapshot) => {
                herramientas = [];
                snapshot.forEach((doc) => {
                    herramientas.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                actualizarVista();
                mostrarToast('🔄 Datos actualizados');
            });
        }

        function actualizarVista() {
            if (!trabajadorActual) return;
            
            const total = herramientas.length;
            const presentes = herramientas.filter(h => h.presente).length;
            const problemas = herramientas.filter(h => h.estado === 'roto').length;
            
            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-card"><div class="stat-number">${total}</div><div>Total</div></div>
                <div class="stat-card"><div class="stat-number" style="color:#27ae60;">${presentes}</div><div>Presentes</div></div>
                <div class="stat-card"><div class="stat-number" style="color:#e74c3c;">${problemas}</div><div>Dañadas</div></div>
            `;
            
            const container = document.getElementById('toolsContainer');
            const filtradas = herramientas.filter(h => 
                h.nombre.toLowerCase().includes(filtro.toLowerCase())
            );

            if (filtradas.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px;">No hay herramientas</div>';
                return;
            }

            container.innerHTML = '';
            filtradas.forEach(h => {
                const miReporte = h.reportes?.find(r => r.trabajadorId === trabajadorActual?.id);
                
                container.innerHTML += `
                    <div class="tool-card ${h.estado}">
                        <div class="tool-name">${h.nombre}</div>
                        <div style="margin: 5px 0;">
                            <span class="status-badge status-${h.estado}">${h.estado}</span>
                        </div>
                        <div class="tool-actions">
                            <label class="checkbox-label">
                                <input type="checkbox" ${h.presente ? 'checked' : ''} 
                                    onchange="togglePresente('${h.id}', this.checked)">
                                Presente
                            </label>
                            
                            ${!miReporte ? `
                                <button class="report-btn" onclick="reportar('${h.id}')">
                                    Reportar
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
        }

        window.togglePresente = async function(id, presente) {
            await updateDoc(doc(db, "herramientas", id), { presente });
        };

        window.reportar = async function(id) {
            const motivo = prompt("Describe el problema:");
            if (!motivo) return;
            
            const herramienta = herramientas.find(h => h.id === id);
            const reportes = herramienta.reportes || [];
            
            reportes.push({
                trabajadorId: trabajadorActual.id,
                trabajadorNombre: trabajadorActual.nombre,
                detalle: motivo,
                timestamp: new Date().toLocaleString()
            });
            
            await updateDoc(doc(db, "herramientas", id), {
                estado: 'roto',
                reportes: reportes
            });
            
            mostrarToast('✅ Reporte enviado');
        };

        document.getElementById('buscador').addEventListener('input', (e) => {
            filtro = e.target.value;
            actualizarVista();
        });
    </script>
</body>
</html>
